name: Diagnostics (temporary)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml', '.github/diag/**']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Where do GIF animations get lost?
        run: python .github/diag/gifcheck.py
