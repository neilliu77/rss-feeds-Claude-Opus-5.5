name: Probe sites (temporary diagnostics)

on:
  push:
    branches: [main]
    paths: ['probe/**']

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install curl_cffi requests
      - run: python probe/probe.py
      - name: Commit results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe-out
          git commit -q -m "probe results ${GITHUB_RUN_ID}" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase origin main || true
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && exit 0
            sleep 5
          done
          exit 1
